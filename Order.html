<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Page</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff5f5;
}

.header{
    background:#f2a6a0;
    color:white;
    padding:20px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
}

img{
    width:200px;
    border-radius:15px;
}

h2{
    color:#f2a6a0;
}

.price{
    font-size:20px;
    color:#ff9f8f;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#f2a6a0;
    color:white;
    text-decoration:none;
    border-radius:12px;
}
</style>

</head>

<body>

<div class="header">
    🐾 Order Page
</div>

<div class="container">

    <img src="your-image.png" alt="Product">

    <h2>Leather Collar</h2>

    <div class="price">$24.99</div>

    <p>Premium leather collar with gold charm 💗</p>

    <a href="AddToCart.html" class="btn">Confirm Order</a>

</div>

</body>
</html>
